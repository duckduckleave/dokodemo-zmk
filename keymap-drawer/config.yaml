draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30
  combo_w: 28
  combo_h: 26
  key_rx: 6
  key_ry: 6
  outer_pad_w: 30
  outer_pad_h: 56
  line_spacing: 1.2
  arc_radius: 6
  append_colon_to_layer_header: true
  style_layer_activators: true
  glyph_tap_size: 22
  svg_extra_style: |
    .combopos-0 text.combo.tap { font-size: 12px; font-weight: 600; }
    .combopos-1 text.combo.tap,
    .combopos-2 text.combo.tap { font-size: 20px; }

    .key.special text.tap { font-size: 20px; }

    .layer-NavNum > text.label { fill: #2563eb; }
    .layer-NavNum rect.key { stroke: #93c5fd; }
    .layer-NavNum .held rect.key { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }

    .layer-Symbols > text.label { fill: #d97706; }
    .layer-Symbols rect.key { stroke: #fcd34d; }
    .layer-Symbols .held rect.key { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }

    .layer-Fn > text.label { fill: #15803d; }
    .layer-Fn rect.key { stroke: #86efac; }
    .layer-Fn .held rect.key { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }

    .layer-Gaming > text.label { fill: #7c3aed; }
    .layer-Gaming rect.key { stroke: #c4b5fd; }

    .key.trigger-nav rect.key {
      fill: #dbeafe; stroke: #2563eb; stroke-width: 2;
    }
    .key.trigger-symbols rect.key {
      fill: #fef3c7; stroke: #d97706; stroke-width: 2;
    }
    .key.trigger-fn rect.key {
      fill: #dcfce7; stroke: #15803d; stroke-width: 2;
    }
    .combo.trigger-gaming rect.combo {
      fill: #ede9fe; stroke: #7c3aed; stroke-width: 2;
    }
    .combo.trigger-gaming use.gamepad { color: #7c3aed; }
    .key.trigger-nav text.hold {
      fill: #2563eb;
      font-size: 16.5px;
      font-weight: bold;
    }
    .key.nav-lock text.tap {
      fill: #2563eb;
      font-size: 16.5px;
      font-weight: bold;
    }
    .key.nav-lock text.hold {
      fill: #24292e;
      font-size: 11px;
      font-weight: normal;
    }
    .key.trigger-symbols text.hold { fill: #d97706; font-weight: bold; }
    .key.fn-label text.hold {
      fill: #24292e;
      font-size: 11px;
      font-weight: normal;
      transform: translateY(-4px);
    }

  # Font Awesome Free bluetooth-b, CC BY 4.0: https://fontawesome.com/license/free
  glyphs:
    bluetooth: |
      <svg viewBox="0 0 256 512">
        <path d="M164.9 260L257.5 156.7 111.6 0 111.6 206.3 25.4 120.2-6 151.6 102.1 260-6 368.4 25.4 399.8 111.6 313.7 114.3 512 262.8 363.4 164.9 260zm40.9-103-50 50-.3-100.3 50.3 50.3zm-50 156 50 50-50.3 50.3.3-100.3z"/>
      </svg>
    gamepad: |
      <svg viewBox="0 0 24 24">
        <path style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" d="M8 8h8a5 5 0 0 1 4.7 3.3l1.1 3.1a3 3 0 0 1-5.2 2.8L15 15H9l-1.6 2.2a3 3 0 0 1-5.2-2.8l1.1-3.1A5 5 0 0 1 8 8Z M7 11v4 M5 13h4 M16.5 11.5h.01 M18.5 13.5h.01"/>
      </svg>

